<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wand controls</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-header">
        <span class="logo-frame" aria-hidden="true">
          <img src="icons/48.png" alt="">
        </span>
        <span>
          <strong>Wand</strong>
          <small>UDOIT + Canvas companion</small>
        </span>
        <span class="version" id="version"></span>
      </header>

      <section class="control-card" aria-labelledby="wand-status-title">
        <label class="toggle-row" for="wand-enabled">
          <span>
            <strong id="wand-status-title">Enable Wand</strong>
            <small id="wand-status">Active on supported pages</small>
          </span>
          <span class="switch">
            <input id="wand-enabled" type="checkbox" role="switch">
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <button class="reload-button" id="reload-wand" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8.1 8.1 0 1 0-2.4 5.8l-1.4-1.4A6.1 6.1 0 1 1 18 11h-3l4 4 4-4h-3Z"></path>
        </svg>
        <span>
          <strong>Reload Wand</strong>
          <small>Reload the extension and refresh open pages</small>
        </span>
      </button>

      <section class="feedback-card" aria-labelledby="feedback-title">
        <div class="feedback-card__heading">
          <span>
            <strong id="feedback-title">Help improve Wand</strong>
            <small>Save a report locally and copy it for the team</small>
          </span>
          <span class="draft-count" id="draft-count"></span>
        </div>
        <div class="feedback-choices" id="feedback-choices">
          <button type="button" data-feedback-kind="bug">Report a bug</button>
          <button type="button" data-feedback-kind="suggestion">Suggest an improvement</button>
        </div>
        <form class="feedback-form" id="feedback-form" hidden>
          <h2 id="feedback-form-title">Create report</h2>
          <label>
            <span>Summary</span>
            <input id="feedback-summary" type="text" required>
          </label>
          <label>
            <span>Details</span>
            <textarea id="feedback-details" rows="4" required></textarea>
          </label>
          <label class="diagnostic-option">
            <input id="feedback-diagnostics" type="checkbox">
            <span>Include recent Wand diagnostics</span>
          </label>
          <div class="feedback-form__actions">
            <button id="feedback-cancel" type="button">Cancel</button>
            <button class="feedback-submit" id="feedback-submit" type="submit">Save and copy</button>
          </div>
        </form>
        <button class="export-button" id="export-feedback" type="button">Export saved reports</button>
      </section>

      <p class="message" id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
