name: Release Wand

on:
  push:
    tags:
      - "wand-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasia/wand
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fantasia/wand/package-lock.json
      - run: npm ci
      - run: npm run release:verify
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "../../downloads/wand-extension-v${GITHUB_REF_NAME#wand-v}.zip" --generate-notes --title "Wand ${GITHUB_REF_NAME#wand-v}"
