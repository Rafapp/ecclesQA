name: Monitor protected Fantasia site

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-password-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasia-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fantasia-site/package-lock.json
      - run: npm ci
      - run: npm run verify:production
