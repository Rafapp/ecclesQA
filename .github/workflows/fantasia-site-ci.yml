name: Fantasia Site CI

on:
  push:
    branches:
      - main
    paths:
      - "fantasia-site/**"
      - ".github/workflows/fantasia-site-ci.yml"
  pull_request:
    paths:
      - "fantasia-site/**"
      - ".github/workflows/fantasia-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasia-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fantasia-site/package-lock.json
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run build
