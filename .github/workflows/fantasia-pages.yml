name: Publish Fantasia Site

on:
  push:
    branches:
      - main
    paths:
      - "fantasia-site/**"
      - ".github/workflows/fantasia-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fantasia-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasia-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fantasia-site/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Export static Pages artifact
        run: |
          npm run start > /tmp/fantasia-site.log 2>&1 &
          npm run export:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: fantasia-site/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
